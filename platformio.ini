; Desktop pet: Black Pill (STM32F401CC or F411CE) + 0.96" SSD1306 OLED.
; The F401CC build also runs on an F411CE. For the F411's full 100 MHz,
; switch default_envs to blackpill_f411ce.

[platformio]
default_envs = blackpill_f401cc

[env]
platform = ststm32
framework = arduino
monitor_speed = 115200

; Upload through the WeAct HID bootloader the board ships with. It lives in
; the first 16 KB of flash, so the app is linked to start at 0x08004000.
; Needs tools/WeAct_HID_Flash-CLI.exe (see README). No driver needed.
board_build.flash_offset = 0x4000
upload_protocol = custom
upload_command = "$PROJECT_DIR/tools/WeAct_HID_Flash-CLI.exe" "$SOURCE"

; Route Serial over the USB cable instead of the PA2/PA3 UART pins.
; Bigger UART buffers: a frame takes ~25 ms to push over I2C, and nothing
; is read from the ports while it does.
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D SERIAL_RX_BUFFER_SIZE=256
    -D SERIAL_TX_BUFFER_SIZE=256
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:blackpill_f401cc]
board = blackpill_f401cc

[env:blackpill_f411ce]
board = blackpill_f411ce
