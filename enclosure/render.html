<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#07090b;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
// Renders assembly.glb (written by check.py) from a few angles.
// render.html#hero | #back | #cutaway | #exploded
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const view = location.hash.slice(1) || 'hero';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090b);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-80, 160, 140);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 1, far: 500 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fdcff, 0.6);
rim.position.set(120, 60, -160);
scene.add(rim);

// a floor to catch the shadow
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const mat = (color, rough = 0.6, metal = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
const MATS = {
  'shell': mat(0xecebe6, 0.72),
  'base': mat(0xd9d8d3, 0.75), 'visor': mat(0x16181b, 0.5),
  'Black Pill': mat(0x151515, 0.5), 'BP jumpers': mat(0x222222, 0.6), 'SWD + plug': mat(0x2a2a2a, 0.6),
  'USB plug mould': mat(0x3a3b3f, 0.55),
  'OLED pcb': mat(0x1f4fa3, 0.5), 'OLED glass': mat(0x050506, 0.15, 0.2), 'OLED header': mat(0x111111, 0.6),
  'OLED jumpers': mat(0x222222, 0.6), 'touch board': mat(0xc0392b, 0.5), 'touch pins': mat(0x222222, 0.6),
  'HC-05': mat(0x2f6fd0, 0.5), 'ESP-01': mat(0x1b1b1b, 0.5), 'AMS1117': mat(0x2e8b57, 0.5),
};
const ENCLOSURE = ['shell', 'base', 'visor'];

// model space is mm with z up; three wants y up
const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;
scene.add(root);

const gltf = await new GLTFLoader().loadAsync('assembly.glb');
const byName = {};
gltf.scene.traverse(o => { if (o.isMesh) byName[o.name.replace(/_/g, ' ')] = o; });   // the loader turns spaces into _

// The face: a real capture of the pet idling, on the glass
const tex = await new THREE.TextureLoader().loadAsync('renders/face.png');
tex.magFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
const face = new THREE.Mesh(new THREE.PlaneGeometry(21.74, 10.86),
  new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
// the plane stands in x/z at the glass front (y = 0.8), facing -y
face.rotation.x = Math.PI / 2;
face.position.set(0, 0.78, 33.5);
root.add(face);

const clip = view === 'cutaway' ? [new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0)] : [];
const hideInside = view === 'hero' || view === 'exploded';
const explode = {
  'base': [0, 0, -40], 'visor': [0, -30, 0],
};

// the tray on its own, empty or with the Black Pill clipped in
const TRAY = { tray: ['base'], 'tray-board': ['base', 'Black Pill', 'BP jumpers', 'SWD + plug', 'USB plug mould'] };
if (TRAY[view]) root.remove(face);

for (const [name, mesh] of Object.entries(byName)) {
  if (TRAY[view] && !TRAY[view].includes(name)) continue;
  if (hideInside && !ENCLOSURE.includes(name)) continue;
  if (view === 'hero' && name === 'USB plug mould') continue;
  const m = mesh.clone();
  // the export carries no normals: smooth the curves, keep edges over 35 degrees sharp
  const g = mesh.geometry.clone();
  g.deleteAttribute('normal');
  g.deleteAttribute('color');
  m.geometry = toCreasedNormals(g, THREE.MathUtils.degToRad(35));
  const material = (MATS[name] || mat(0x888888)).clone();
  // the cut goes through everything except what sits on the centre line
  const whole = ['visor', 'Black Pill', 'BP jumpers', 'SWD + plug', 'USB plug mould', 'OLED pcb', 'OLED glass',
                 'OLED header', 'OLED jumpers', 'touch board', 'touch pins'];
  if (!whole.includes(name)) {
    material.clippingPlanes = clip;
    material.side = THREE.DoubleSide;
  }
  m.material = material;
  m.castShadow = m.receiveShadow = true;
  if (view === 'exploded' && explode[name]) m.position.set(...explode[name]);
  root.add(m);
}
if (view === 'exploded') face.position.y += -30;

// frame the shot
const cam = new THREE.PerspectiveCamera(24, W / H, 1, 2000);
const target = new THREE.Vector3(0, 30, -35);        // (x, z, -y) in three's axes
const shots = {
  hero:     { pos: [-150, 115, 205], target: [0, 30, -33] },
  back:     { pos: [95, 85, -275],   target: [0, 24, -40] },
  cutaway:  { pos: [235, 120, 90],   target: [0, 26, -35] },
  exploded: { pos: [-190, 140, 250], target: [0, 26, -33] },
  tray:         { pos: [-150, 125, 150], target: [0, 10, -36] },
  'tray-board': { pos: [-150, 125, 150], target: [0, 12, -36] },
};
const s = shots[view];
cam.position.set(...s.pos);
cam.lookAt(new THREE.Vector3(...s.target));
renderer.render(scene, cam);
window.done = true;
</script>
</body>
</html>
