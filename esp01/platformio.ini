; The desktop pet's WiFi: an ESP-01 (ESP8266) that fetches the time and
; weather for the pet, and lets Aminal reach it over the network.
; A separate project from the pet's own firmware in the folder above.
;
;   pio run -t upload --upload-port COMx     (module in its USB adapter,
;                                             GPIO0 held to GND at power-up)

[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -D NDEBUG
lib_deps =
    tzapu/WiFiManager
    bblanchon/ArduinoJson
